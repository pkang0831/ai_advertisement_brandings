    repo_id: ByteDance-Seed/SeedVR2-3B
    revision: 37255ff8cccfb01071b87f635a5948ca8d53117c
    local_path: seedvr2/ByteDance-Seed-SeedVR2-3B

  - id: z-image-cuda
    tier: qwen_cuda
    runtime: cuda
    kind: snapshot
    repo_id: Tongyi-MAI/Z-Image
    revision: 04cc4abb7c5069926f75c9bfde9ef43d49423021
    local_path: z_image/Tongyi-MAI-Z-Image

# Mac rclone only (not downloaded by Colab HF script)
local_only:
  - path: loras/rina_park_person_sdxl_lora.safetensors
    reason: self-trained character LoRA
  - path: loras/rina_park_person_sdxl_lora-step00000400.safetensors
    reason: training checkpoint
  - path: loras/rina_park_person_sdxl_lora-step00000800.safetensors
    reason: training checkpoint
  - path: loras/rina_park_person_sdxl_lora-step00001200.safetensors
    reason: training checkpoint
  - path: loras/rina_park_person_sdxl_lora-step00001600.safetensors
    reason: training checkpoint
  - path: loras/
    reason: CivitAI LoRAs (skin/film/hands/etc.) — sync whole folder from Mac
  - path: checkpoints/juggernautXL_ragnarok.safetensors
    reason: CivitAI
  - path: checkpoints/cyberrealisticXL_v100.safetensors
    reason: CivitAI
