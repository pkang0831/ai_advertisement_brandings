# scene_type → 프롬프트 블록 + 하이퍼파라미터 프리셋
# identity_fixed 블록은 모든 SFW 씬에 prepend. scene_block만 교체.

meta:
  identity_fixed: >-
    rina_park_person, fictional adult Korean-Canadian woman age 27,
    fair natural skin texture, long dark hair, soft glam, relaxed closed mouth,
    candid smartphone lifestyle photo, looking away from camera,
    engaged with activity, gaze off-camera, natural pores, slight film grain,
    28-50mm phone perspective
  # Default gaze for IG + most home NSFW: candid / off-camera (not eye contact).
  # Intentional selfie only when scene sets intentional_selfie: true (rare; Week1 OFF).
  gaze_rule:
    default: looking_away_candid
    positive: >-
      looking away from camera, candid, engaged with activity, gaze off-camera
    negative: >-
      looking at camera, eye contact with camera, staring at viewer, selfie pose
    selfie_beats: rare_optional_default_off
  # Prefer hiding hands/feet via composition. ADetailer/inpaint hands only when hands_hero.
  hands_feet_rule:
    default: hide_via_composition
    hands_hero_default: false
    week01_hands_hero: false
    positive: >-
      hands in pockets or holding cup or bag, hands cropped out of frame,
      soft out-of-focus hands, feet out of frame or obscured
    negative: >-
      extra fingers, deformed hands, bad anatomy hands, bad anatomy feet,
      bare feet close-up, detailed hands in foreground
    hand_detailer_default: false
    note: >-
      FaceDetailer face ON; do NOT enable hand detailer/ADetailer by default.
      Optional hand refine only when scene sets hands_hero: true (rare grip/workout).
  # Soft preference for FUTURE runs (Week1 locked as-approved; do not regen Week1).
  eyes_soft_preference:
    code: eyes_slightly_larger_preferred
    positive: >-
      slightly larger eyes, subtle doe eyes, soft open eyes, photoreal
    negative: >-
      small eyes, squinting, beady eyes, anime eyes, exaggerated eyes, oversized eyes
    note: >-
      Gentle photoreal bias only — NOT anime, NOT exaggerated; keep realism.
  platform_negative: >-
    underage, teen, babyface, nude, explicit, nipples, genitals,
    bad hands, extra fingers, deformed hands, bad anatomy hands, bad anatomy feet,
    bare feet close-up, detailed hands in foreground,
    distorted face, plastic skin, beauty filter, studio softbox,
    model catalog pose, watermark, text, oversmooth skin,
    extreme back of head only, unrecognizable face,
    looking at camera, eye contact with camera, staring at viewer, selfie pose,
    small eyes, squinting, beady eyes, anime eyes, exaggerated eyes
  defaults:
    lora_scale: 0.90
    steps: 36
    cfg: 4.2
    size: "832x1216"
    hands_hero: false

